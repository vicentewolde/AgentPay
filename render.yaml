services:
  - type: web
    name: agentpey-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @agentpey/web run start
    envVars:
      # pnpm@11.24.0 (pinned via packageManager in package.json) requires
      # Node >=22.13 to run under Corepack — 22.11.0 makes Corepack crash
      # with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING instead of a clean
      # error, and plain `npm install -g pnpm` refuses to run at all
      # ("This version of pnpm requires at least Node.js v22.13").
      - key: NODE_VERSION
        value: 22.14.0
      # Corepack verifies the signature of the pnpm release it downloads
      # against a hardcoded key list. npm rotated its package-signing key
      # in 2025 and older Corepack builds predate the new key, so
      # verification can fail with "Cannot find matching keyid". This
      # disables that signature check (does not affect pnpm's own package
      # integrity hashes, which stay enforced). Kept as insurance even
      # though the Node-version bump above was the actual fix for the
      # last failure.
      - key: COREPACK_INTEGRITY_KEYS
        value: ""
      # Secrets — set these in the Render dashboard after the first deploy.
      # Never committed, never filled in here.
      - key: ISSUER_SECRET_KEY
        sync: false
      - key: AGENT_SECRET_KEY
        sync: false
      - key: AGENT_REGISTRY_CONTRACT_ID
        sync: false
      # T35 — signs `register_issuer` when a connected wallet anchors its
      # first Mandate (ensureWalletIsRegisteredIssuer). Same admin key
      # deploy:registry already uses locally; missing here is exactly why
      # a wallet-signed session fails at "Iniciar sesión" with
      # "ADMIN_SECRET_KEY is missing".
      - key: ADMIN_SECRET_KEY
        sync: false
      # T33 — a Postgres connection string (e.g. Supabase). Required: without
      # it the MandateVault has nowhere durable to write, which is exactly
      # the bug this hito fixes (the old JSONL file lived on Render's
      # ephemeral disk and was wiped on every redeploy).
      - key: DATABASE_URL
        sync: false
      # F4/T40 — the master seed each tenant's own derived Stellar identity
      # comes from (`@agentpey/tenancy`). Required for any wallet session:
      # without it, `MASTER_MNEMONIC is missing` at "Iniciar sesión", the
      # same class of omission `ADMIN_SECRET_KEY` already taught (T35). Not
      # generated or set by this commit — this line only reserves the name
      # Render will prompt for; the actual value is set in the dashboard,
      # once, and never regenerated (`.env.example`'s comment explains why).
      - key: MASTER_MNEMONIC
        sync: false
      - key: BAZAAR_BASE_URL
        value: https://stellar-bazaar-x402.vercel.app
      # Not a secret — a public Soroban contract address, already committed
      # in deployments/testnet.json and shown as `pagador` on the live demo
      # itself. Migrated once already (see AGENT_LOG.md, 2026-09-12): the
      # rail this pointed to since T31 predates T57's `principal`/`withdraw`/
      # `set_owner` — funds sent to it could never come back out. Redeployed
      # from the current wasm (same one T58's per-tenant rails use, see
      # POLICY_RAIL_WASM_HASH below), owned by the agent, with
      # ADMIN_PUBLIC_KEY as principal. The old contract
      # (CCGAGRLVERK2A6PVQNU6YY62ANWNSFO32DM6OMFLRNLVHYJBLLON4G3I) is
      # abandoned with whatever symbolic testnet balance it held — not worth
      # recovering, and it never could be without this exact migration.
      - key: POLICY_RAIL_CONTRACT_ID
        value: CANSQJH7KPQTBUXPA42BBWZGZRKLWQZUFVF3SLQOUWKHEX4L3JP7YEDA
      # Not a secret either — the wasm hash of `contracts/policy-rail`'s
      # current source (T57, `principal`/`withdraw`/`set_owner`), already
      # uploaded to testnet. `ensureTenantPolicyRail` (F6/T58) instantiates a
      # new rail per wallet-connected tenant from this same wasm, without
      # re-uploading it — one upload, many `createCustomContract` calls.
      - key: POLICY_RAIL_WASM_HASH
        value: 8690d1f5ce18e6ef6209a400918d095450c01d7a8621ac795f404e11ea7e3175
